# pnpm workspace.
# Frontend lives at the repo root; the Express backend is a separate deployable
# member. One tool (pnpm), one lockfile (pnpm-lock.yaml) covers both packages.
#
# Note: the backend's native dep (better-sqlite3) is built only where it is
# deployed (Linux/Docker — see RUNBOOK.md). On a Windows dev host, install the
# frontend with `pnpm install --filter walt` to skip the native backend build.
packages:
  - 'backend'

# Never run an implicit `pnpm install` before scripts (e.g. `pnpm test`).
# On a Windows dev host the backend's native dep (better-sqlite3) cannot be
# built, so an implicit install would fail. Install the frontend explicitly with
# `pnpm install --filter walt --no-frozen-lockfile`.
verifyDepsBeforeRun: false

# Build scripts are opt-in under pnpm v11+. These are the only packages allowed
# to run install/build scripts.
allowBuilds:
  '@firebase/util': true
  '@tsparticles/engine': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
